<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Automatic ADC gate for IMU frequency estimation</title>
  <desc id="desc">Two schematic lanes share a time axis. The higher ADC entry threshold starts the gate, and the lower hold threshold sustains it. One dip below hold is bridged because the ADC returns to hold within 80 milliseconds. The gate spans from the entry sample to the last sample meeting hold. Only IMU samples inside that span, including those during the dip, feed the DFT. The trace and dots are illustrative.</desc>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="#fff" stroke="#D8E4EB" stroke-width="2"/>
  <g font-family="Arial, system-ui, sans-serif" font-size="18" fill="#122640">
    <text x="24" y="29" font-weight="700">Automatic ADC gate</text>
    <text x="24" y="61" font-weight="700">ADC counts</text>
    <text x="202" y="83" text-anchor="end">Entry threshold</text>
    <text x="202" y="113" text-anchor="end">Hold threshold</text>
    <text x="24" y="204" font-weight="700">IMU motion</text>
    <text x="24" y="244">Schematic</text>

    <rect x="345" y="173" width="370" height="48" fill="#EDF3FB"/>
    <path d="M220 77H866 M220 107H866" fill="none" stroke="#D8E4EB"
          stroke-width="2" stroke-dasharray="6 5"/>
    <path d="M220 197H866" stroke="#D8E4EB" stroke-width="2"/>
    <path d="M345 46V221 M715 46V221" fill="none" stroke="#087D77"
          stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>

    <path d="M220 130H298V96H345V57H443V66H493V130H560V107H591V61H662V89H715V130H866"
          fill="none" stroke="#087D77" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="345" cy="57" r="4" fill="#087D77"/>
    <circle cx="715" cy="89" r="4" fill="#087D77"/>

    <text x="526.5" y="25" text-anchor="middle" fill="#B14D28">Bridged dip ≤ 80 ms</text>
    <path d="M493 56V35H560V96" fill="none" stroke="#B14D28" stroke-width="1.5"
          stroke-dasharray="4 4"/>

    <path d="M345 149V157H715V149" fill="none" stroke="#087D77" stroke-width="2"/>
    <text x="530" y="149" text-anchor="middle" fill="#087D77" font-weight="700">ADC-high time span</text>

    <g fill="#fff" stroke="#2658A5" stroke-opacity=".55" stroke-width="1.6">
      <circle cx="238" cy="199" r="3.6"/><circle cx="266" cy="191" r="3.6"/>
      <circle cx="294" cy="207" r="3.6"/><circle cx="322" cy="194" r="3.6"/>
      <circle cx="742" cy="194" r="3.6"/><circle cx="770" cy="207" r="3.6"/>
      <circle cx="798" cy="190" r="3.6"/><circle cx="826" cy="201" r="3.6"/>
      <circle cx="854" cy="195" r="3.6"/>
    </g>
    <g fill="#2658A5">
      <circle cx="350" cy="185" r="4"/><circle cx="378" cy="192" r="4"/>
      <circle cx="406" cy="207" r="4"/><circle cx="434" cy="210" r="4"/>
      <circle cx="462" cy="194" r="4"/><circle cx="490" cy="184" r="4"/>
      <circle cx="518" cy="188" r="4"/><circle cx="546" cy="204" r="4"/>
      <circle cx="574" cy="211" r="4"/><circle cx="602" cy="198" r="4"/>
      <circle cx="630" cy="185" r="4"/><circle cx="658" cy="190" r="4"/>
      <circle cx="686" cy="206" r="4"/><circle cx="704" cy="210" r="4"/>
    </g>
    <text x="530" y="244" text-anchor="middle" fill="#2658A5" font-weight="700">Only gated IMU samples feed the DFT</text>
    <text x="821" y="244" text-anchor="end">Time</text>
    <path d="M830 238H865 M859 233L865 238L859 243" fill="none" stroke="#122640" stroke-width="1.8"/>
  </g>
</svg>
