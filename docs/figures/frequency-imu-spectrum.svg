<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" role="img" aria-labelledby="title desc">
  <title id="title">From three IMU axes to two spectral peaks</title>
  <desc id="desc">Four processing steps feed a schematic spectrum. A peak near 3 Hz is selected within the percussion band and a peak near 8 Hz within the vibration band.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto-start-reverse" viewBox="0 0 8 7"><path d="M0 0L7 3.5L0 7Z" fill="#425C72"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="293" rx="16" fill="#fff" stroke="#D8E4EB" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#122640">
    <rect x="26" y="24" width="194" height="65" rx="8" fill="#EAF1FB" stroke="none"/>
<text x="123" y="51" font-size="18" font-weight="700" fill="#122640" text-anchor="middle">Device samples</text>
<text x="123" y="74" font-size="18" font-weight="400" fill="#425C72" text-anchor="middle">X, Y and Z</text>
<path d="M223 56L240 56" stroke="#425C72" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="243" y="24" width="194" height="65" rx="8" fill="#EAF1FB" stroke="none"/>
<text x="340" y="51" font-size="18" font-weight="700" fill="#122640" text-anchor="middle">Linear resampling</text>
<text x="340" y="74" font-size="18" font-weight="400" fill="#425C72" text-anchor="middle">Uniform time grid</text>
<path d="M440 56L457 56" stroke="#425C72" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="460" y="24" width="194" height="65" rx="8" fill="#EAF1FB" stroke="none"/>
<text x="557" y="51" font-size="18" font-weight="700" fill="#122640" text-anchor="middle">Mean removal</text>
<text x="557" y="74" font-size="18" font-weight="400" fill="#425C72" text-anchor="middle">and Hann taper</text>
<path d="M657 56L674 56" stroke="#425C72" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="677" y="24" width="194" height="65" rx="8" fill="#EAF1FB" stroke="none"/>
<text x="774" y="51" font-size="18" font-weight="700" fill="#122640" text-anchor="middle">Direct DFT</text>
<text x="774" y="74" font-size="18" font-weight="400" fill="#425C72" text-anchor="middle">Sum axis powers</text>
<rect x="169" y="114" width="244" height="107" rx="4" fill="#E8F6F2" stroke="none"/>
