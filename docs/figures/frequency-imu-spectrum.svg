<text x="611.25" y="139" font-size="18" font-weight="700" fill="#2658A5" text-anchor="middle">Vibration</text>
<path d="M108 221L852 221" stroke="#425C72" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="83" y="197" font-size="18" font-weight="400" fill="#425C72" text-anchor="end">Power</text>
